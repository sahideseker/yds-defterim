<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>YDS Defterim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f1ea;--card:#fffdf9;--ink:#1c2230;--muted:#6d6a64;--line:#e6dfd2;
  --acc:#d9622b;--acc-soft:#fbe6da;--ok:#2d7a5f;--ok-soft:#dcefe6;--bad:#c23b36;--bad-soft:#f8dedc;
  --kal:#4a5bd1;--kal-soft:#e3e6fb;--kel:#a6621a;--kel-soft:#f6e8d3;--gold:#e7a627;
  --r:16px;--sh:0 1px 2px rgba(30,25,15,.06),0 4px 16px rgba(30,25,15,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15171c;--card:#1e2128;--ink:#ece8e1;--muted:#a19c93;--line:#2e323b;
  --acc:#ef7a43;--acc-soft:#3a2519;--ok:#4cb48b;--ok-soft:#183128;--bad:#ea6a63;--bad-soft:#3a1d1c;
  --kal:#8c99ff;--kal-soft:#252a4a;--kel:#e0a560;--kel-soft:#3a2c1a;--sh:0 1px 2px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif;padding-bottom:84px;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.brand,.big{font-family:"Bricolage Grotesque","DM Sans",sans-serif;letter-spacing:-.01em}
h1{font-size:28px;margin:0 0 4px}h2{font-size:21px;margin:0 0 12px}h3{font-size:17px;margin:0 0 8px}
a{color:var(--acc)}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.brand{font-size:20px;font-weight:800;white-space:nowrap}.brand b{color:var(--acc)}
.hud{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:13px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.lvbar{width:56px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}.lvbar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .5s}
.sync{font-size:12px;color:var(--muted);font-weight:500}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs a{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:1px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:700;padding:4px;border-radius:12px}
nav.tabs a span{font-size:19px;line-height:1.2}
@media (max-width:420px){nav.tabs a{font-size:10.5px;padding:4px 1px}}
nav.tabs a.on{color:var(--acc);background:var(--acc-soft)}
@media (min-width:760px){
  body{padding-bottom:30px}
  nav.tabs{position:sticky;top:53px;bottom:auto;justify-content:center;gap:6px;background:transparent;border:0;padding:12px}
  nav.tabs a{flex-direction:row;gap:6px;max-width:none;flex:0 0 auto;padding:7px 14px;font-size:14px;background:var(--card);border:1px solid var(--line)}
  nav.tabs a span{font-size:16px}
  nav.tabs a.on{border-color:var(--acc)}
}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stack>*+*{margin-top:14px}
.muted{color:var(--muted)}.small{font-size:13px}.center{text-align:center}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 15px;font-weight:700;cursor:pointer;transition:transform .08s,background .15s;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:10px}
.btn.lg{padding:14px 22px;font-size:17px;border-radius:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.ai-only{display:none!important}.ai-txt{display:none}body.has-ai .ai-txt{display:inline}body.has-ai .ai-only{display:inline-flex!important}
body.has-ai .no-ai{display:none!important}
.ai{background:linear-gradient(135deg,#6d5bd0,#c2569b);border:0;color:#fff}
label.f{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 4px}
.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;outline:none}
.in:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{min-height:90px;resize:vertical}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.chip{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:99px}
.chip.kelime{background:var(--kel-soft);color:var(--kel)}.chip.kalip{background:var(--kal-soft);color:var(--kal)}
.chip.src{background:var(--bg);color:var(--muted);border:1px solid var(--line);text-transform:none;letter-spacing:0;font-weight:600}
.hero{background:linear-gradient(135deg,var(--acc),#b8432a);color:#fff;border:0}
.hero .muted{color:rgba(255,255,255,.8)}
.hero .btn{background:#fff;color:#b8432a;border:0}
.big{font-size:40px;font-weight:800;line-height:1}
.stat .big{font-size:30px}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.25) 0);display:grid;place-items:center;flex:none}
.ring>div{width:72px;height:72px;border-radius:50%;background:#c9502a;display:grid;place-items:center;font-weight:800;font-size:15px;text-align:center;line-height:1.1}
.week{display:flex;gap:8px;align-items:flex-end;height:110px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px;color:var(--muted)}
.week i{display:block;width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:var(--acc);min-height:3px}
.week .goalhit i{background:var(--ok)}
.boxes{display:flex;height:16px;border-radius:9px;overflow:hidden;background:var(--line)}
.boxes i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.item{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);cursor:pointer}
.item+.item{margin-top:8px}
.item .en{font-weight:800;font-size:17px}
.item .tr{color:var(--muted)}
.item .more{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px}
.dots{display:inline-flex;gap:3px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ok)}
.ex{font-style:italic}
.empty{text-align:center;padding:34px 18px}
.empty .big{font-size:48px;margin-bottom:6px}
.game-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.prog{flex:1;height:8px;background:var(--line);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.flash{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none;padding:28px 20px}
.flash .w{font-family:"Bricolage Grotesque",sans-serif;font-size:34px;font-weight:800;line-height:1.15;word-break:break-word}
.flash .m{font-size:22px;font-weight:700;color:var(--acc);margin-top:14px}
.flash hr{width:60%;border:0;border-top:1px dashed var(--line);margin:16px auto}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:13px 16px;font-weight:600;cursor:pointer;font-size:16px}
.opt:hover{border-color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt kbd{display:inline-block;min-width:22px;text-align:center;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;margin-right:8px;font-family:inherit}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:15px}
.fb.ok{background:var(--ok-soft)}.fb.no{background:var(--bad-soft)}
.combo{font-weight:800;color:var(--acc)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px;min-height:58px;font-weight:700;cursor:pointer;text-align:center;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .15s}
.tile.sel{border-color:var(--acc);background:var(--acc-soft)}
.tile.done{opacity:0;pointer-events:none;transform:scale(.9)}
.tile.shake{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.gap{font-size:19px;line-height:1.6}
.gap .blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--acc);margin:0 2px}
.gap .fill{color:var(--ok);font-weight:800;border-bottom:3px solid var(--ok)}
.games .card{display:flex;flex-direction:column;gap:6px}
.games .ic{font-size:30px}
mark.hl{background:var(--acc-soft);color:inherit;border-bottom:2px solid var(--acc);border-radius:3px;padding:0 1px;cursor:help}
.sent{border-left:3px solid var(--line);padding:4px 0 4px 12px}
.sent+.sent{margin-top:14px}
.sent .tr{color:var(--ok);margin-top:4px}
.sent .st{font-size:13px;color:var(--muted);margin-top:4px;background:var(--bg);border-radius:8px;padding:6px 10px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25);animation:tin .25s;max-width:88vw;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
#modal{position:fixed;inset:0;z-index:50;background:rgba(15,15,20,.45);display:flex;align-items:flex-end;justify-content:center;padding:12px}
#modal[hidden]{display:none}
#modal .card{width:100%;max-width:560px;max-height:88vh;overflow:auto}
@media (min-width:760px){#modal{align-items:center}}
.xpfly{position:fixed;z-index:70;font-weight:800;color:var(--acc);pointer-events:none;animation:fly 0.9s ease-out forwards;font-size:18px}
@keyframes fly{to{transform:translateY(-50px);opacity:0}}
.conf{position:fixed;top:-10px;width:9px;height:14px;z-index:80;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.loader{padding:60px 0;text-align:center;color:var(--muted)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
details summary{cursor:pointer;font-weight:700}
.kbdhint{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
@media (max-width:759px){.kbdhint{display:none}.hud .hide-m{display:none}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">YDS <b>Defterim</b></div>
  <div class="hud">
    <span class="pill" title="Seviye"><span id="hLvl">Lv 1</span><span class="lvbar"><i id="hBar" style="width:0"></i></span></span>
    <span class="pill" id="hStreak" title="Seri: arka arkaya çalışılan gün">🔥 0</span>
    <span class="pill" id="hToday" title="Bugünkü XP / günlük hedef">⭐ 0/100</span>
    <span class="sync hide-m" id="sync"></span>
  </div>
</div></header>
<nav class="tabs">
  <a href="#ana" data-v="ana"><span>🏠</span>Ana</a>
  <a href="#ekle" data-v="ekle"><span>➕</span>Ekle</a>
  <a href="#defter" data-v="defter"><span>📒</span>Defter</a>
  <a href="#calis" data-v="calis"><span>🎮</span>Çalış</a>
  <a href="#rehber" data-v="rehber"><span>📘</span>Rehber</a>
  <a href="#metin" data-v="metin"><span>📄</span>Metin</a>
</nav>
<main id="main"><div class="loader"><span class="spin"></span> Defterin açılıyor…</div></main>
<div id="toast"></div>
<div id="modal" hidden></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayKey = d => d.toLocaleDateString('sv');
const today = () => dayKey(new Date());
const newId = p => (p||'i') + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const norm = s => String(s||'').toLowerCase().replace(/[’`]/g,"'").replace(/[^\p{L}\p{N}' ]+/gu,' ').replace(/\s+/g,' ').trim();
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const DAY = 864e5;
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,i)=>i); for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
function toast(msg, ms=2600){ const d=document.createElement('div'); d.textContent=msg; $('#toast').appendChild(d); setTimeout(()=>d.remove(), ms); }
function xpFly(n, el){ if(!n) return; const r=(el||document.body).getBoundingClientRect(); const s=document.createElement('div'); s.className='xpfly'; s.textContent='+'+n+' XP'; s.style.left=(r.left+r.width/2-30)+'px'; s.style.top=(el? r.top : window.innerHeight/2)+'px'; document.body.appendChild(s); setTimeout(()=>s.remove(),950); }
function confetti(){ const cols=['#d9622b','#e7a627','#2d7a5f','#4a5bd1','#c2569b']; for(let i=0;i<70;i++){ const c=document.createElement('i'); c.className='conf'; c.style.left=Math.random()*100+'vw'; c.style.background=cols[i%cols.length]; c.style.animationDuration=(1.6+Math.random()*1.8)+'s'; c.style.animationDelay=(Math.random()*.5)+'s'; document.body.appendChild(c); setTimeout(()=>c.remove(),4200);} }
function parseJSON(t){ if(!t) return null; t=String(t).replace(/```json|```/g,''); const a=Math.min(...['{','['].map(ch=>{const i=t.indexOf(ch);return i<0?1e9:i})); const b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']')); if(a>=1e9||b<a) return null; try{ return JSON.parse(t.slice(a,b+1)); }catch(e){ return null; } }

/* ---------- state ---------- */
const DEF_STATS = {xp:0, days:{}, goal:100, examDate:'', target:55, bestMatch:0, ts:0};
const S = {
  ready:false, mode:'', items:[], texts:[], stats:{...DEF_STATS},
  view:'ana', ai:false,
  df:{q:'', type:'hepsi', src:'', sort:'yeni', open:null},
  pf:{scope:'gunluk', type:'hepsi', src:''},
  dir:'en', lastSource:'', metinOpen:null,
  gnotes:{}, exams:[], r:{q:'',g:'',open:null,back:null,quiz:null,scan:''}
};
try { const p=JSON.parse(localStorage.getItem('ydsdefter_prefs')||'{}'); if(p.pf) S.pf={...S.pf,...p.pf}; if(p.dir) S.dir=p.dir; if(p.lastSource) S.lastSource=p.lastSource; } catch(e){}
function savePrefs(){ try{ localStorage.setItem('ydsdefter_prefs', JSON.stringify({pf:S.pf, dir:S.dir, lastSource:S.lastSource})); }catch(e){} }
let db=null, col=null, sample=null;

function mkItem(o, keep){
  const b = keep || {};
  return {
    id: o.id || b.id || newId('i'),
    type: (o.type||b.type)==='kalip' ? 'kalip' : 'kelime',
    en: String(o.en ?? b.en ?? '').trim(), tr: String(o.tr ?? b.tr ?? '').trim(),
    example: String(o.example ?? b.example ?? '').trim(), exampleTr: String(o.exampleTr ?? b.exampleTr ?? '').trim(),
    note: String(o.note ?? b.note ?? '').trim(), source: String(o.source ?? b.source ?? '').trim(),
    tags: Array.isArray(o.tags) ? o.tags : String(o.tags ?? (b.tags||[]).join(',')).split(',').map(s=>s.trim()).filter(Boolean),
    box: +(o.box ?? b.box ?? 0)||0, due: +(o.due ?? b.due ?? 0)||0, seen: +(o.seen ?? b.seen ?? 0)||0,
    correct: +(o.correct ?? b.correct ?? 0)||0, wrong: +(o.wrong ?? b.wrong ?? 0)||0,
    created: +(o.created ?? b.created ?? Date.now()), updated: Date.now()
  };
}

/* ---------- storage ---------- */
const LS_KEY='ydsdefter_v1';
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){ return null; } }
let lsT=null;
function lsSaveSoon(){ clearTimeout(lsT); lsT=setTimeout(()=>{ try{ localStorage.setItem(LS_KEY, JSON.stringify({items:S.items, texts:S.texts, stats:S.stats, gnotes:S.gnotes, exams:S.exams})); setSync('ok'); }catch(e){ toast('Tarayıcı hafızası dolu ya da kapalı: yedek almayı unutma.'); } }, 250); }

const wq = new Map(); let wRunning=false;
function persist(id, data){
  if(S.mode!=='cloud'){ lsSaveSoon(); return; }
  wq.delete(id); wq.set(id, data); setSync('saving');
  if(!wRunning) runQ();
}
async function doWrite(id, data){ const ref=col.doc(id); if(data===null) await ref.delete(); else await ref.set(data); }
async function runQ(){
  wRunning=true; let err=false;
  while(wq.size){
    const [id,data]=wq.entries().next().value; wq.delete(id);
    try{ await doWrite(id,data); }
    catch(e){
      if(e && (e.code==='unavailable'||e.code==='resource_exhausted')){ await sleep(800+Math.random()*900); try{ await doWrite(id,data); }catch(e2){ err=true; writeFail(e2); } }
      else { err=true; writeFail(e); }
    }
  }
  wRunning=false; setSync(err?'err':'ok');
}
function writeFail(e){ const c=e&&e.code; if(c==='quota_exceeded') toast('Depolama sınırı doldu: bazı eski metinleri silmen gerekebilir.',5000); else toast('Kaydedilemedi ('+(c||'hata')+'). Bağlantını kontrol et.',4000); }
function setSync(st){ const el=$('#sync'); if(!el) return; el.textContent = S.mode==='local' ? '💾 Bu tarayıcıda' : st==='saving' ? '⏳ Kaydediliyor' : st==='err' ? '⚠️ Kaydedilemedi' : '☁️ Kayıtlı'; el.title = S.mode==='local' ? 'Bulut kaydı kullanılamıyor; veriler yalnızca bu tarayıcıda. Defter > Yedek bölümünden yedek al.' : 'Defterin hesabına kayıtlı, her cihazdan açabilirsin.'; }

function saveItem(it){ const i=S.items.findIndex(x=>x.id===it.id); if(i<0) S.items.unshift(it); else S.items[i]=it; persist(it.id, {...it, kind:'item'}); }
function deleteItem(id){ S.items=S.items.filter(x=>x.id!==id); persist(id, null); }
function saveText(t){ const i=S.texts.findIndex(x=>x.id===t.id); if(i<0) S.texts.unshift(t); else S.texts[i]=t; persist(t.id, {...t, kind:'text'}); }
function deleteText(id){ S.texts=S.texts.filter(x=>x.id!==id); persist(id, null); }
let stT=null;
function saveStats(){ S.stats.ts=Date.now(); clearTimeout(stT); if(S.mode!=='cloud'){ lsSaveSoon(); return; } stT=setTimeout(()=>persist('_stats', {...S.stats, kind:'stats'}), 1200); }

/* ---------- connect ---------- */
async function connect(){
  let C = window.claude;
  for(let i=0;i<20 && !(C&&C.use);i++){ await sleep(100); C=window.claude; }
  if(!C || !C.use){ goLocal(); return; }
  C.use('sample').then(s=>{ sample=s; S.ai=!!s; document.body.classList.toggle('has-ai', !!s); }).catch(()=>{});
  let u=null, d=null;
  try{ [u,d] = await Promise.all([C.use('user'), C.use('db')]); }catch(e){}
  let id=null; if(u&&d){ try{ id=await u.id(); }catch(e){} }
  if(!d || !id){ goLocal(); return; }
  db=d; col=db.collection('data/users/'+id); S.mode='cloud'; setSync('ok');
  const loadT=setTimeout(()=>{ if(!S.ready){ toast('Kayıtlı verine henüz ulaşılamadı, bağlantını kontrol et.',5000); setSync('err'); } }, 10000);
  let first=true;
  col.onSnapshot(snap=>{
    const items=[], texts=[], exams=[], gnotes={}; let stats=null;
    snap.docs.forEach(doc=>{ const v=doc.data(); if(!v) return;
      if(wq.has(doc.id)) return;
      if(v.kind==='item') items.push(mkItem({...v, id:doc.id}, null));
      else if(v.kind==='text') texts.push({...v, id:doc.id});
      else if(v.kind==='exam') exams.push({...v, id:doc.id});
      else if(v.kind==='gnote') gnotes[v.card]=v;
      else if(doc.id==='_stats') stats=v; });
    // keep local versions of still-queued writes
    for(const [k,v] of wq){ if(v===null) continue; if(v.kind==='item') items.push(mkItem(v)); else if(v.kind==='text') texts.push({...v}); else if(v.kind==='exam') exams.push({...v}); else if(v.kind==='gnote') gnotes[v.card]=v; }
    S.items = items.sort((a,b)=>b.created-a.created);
    S.texts = texts.sort((a,b)=>(b.created||0)-(a.created||0));
    S.exams = exams.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.created||0)-(b.created||0)); S.gnotes = gnotes;
    if(stats && (+stats.ts||0) >= (S.stats.ts||0)) S.stats = {...DEF_STATS, ...stats, days:{...(stats.days||{})}};
    if(!snap.metadata.fromCache){ clearTimeout(loadT); if(first){ first=false; migrateLocal(snap.empty); } }
    S.ready=true; onData();
  }, err=>{ clearTimeout(loadT); setSync('err'); toast('Bağlantı kesildi; değişiklikler kaydedilmeyebilir. Sayfayı yenile.',6000); if(!S.ready) goLocal(); });
}
function goLocal(){
  S.mode='local'; const l=lsLoad();
  if(l){ S.items=(l.items||[]).map(x=>mkItem(x)); S.texts=l.texts||[]; S.stats={...DEF_STATS,...(l.stats||{})}; S.gnotes=l.gnotes||{}; S.exams=l.exams||[]; }
  S.ready=true; setSync('ok'); onData();
}
async function migrateLocal(isEmpty){
  let done=false; try{ done=localStorage.getItem('ydsdefter_migrated')==='1'; }catch(e){}
  const l=lsLoad(); if(done || !isEmpty || !l || !(l.items||[]).length) return;
  (l.items||[]).forEach(x=>{ const it=mkItem(x); S.items.push(it); persist(it.id,{...it,kind:'item'}); });
  (l.texts||[]).forEach(t=>saveText(t));
  (l.exams||[]).forEach(e=>saveExam(e)); Object.values(l.gnotes||{}).forEach(n=>saveGNote(n));
  if(l.stats){ S.stats={...DEF_STATS,...l.stats}; saveStats(); }
  try{ localStorage.setItem('ydsdefter_migrated','1'); }catch(e){}
  toast('Bu tarayıcıdaki eski kayıtların hesabına taşındı ✓'); onData();
}

/* ---------- XP / levels / SRS ---------- */
const TITLES=['Çaylak','Kelime Avcısı','Kalıp Toplayıcı','Cümle Çözücü','Paragraf Kaşifi','Metin Dedektifi','Bağlaç Ustası','YDS Savaşçısı','55+ Adayı','Akademik Okur','Çeviri Ustası','YDS Efsanesi'];
function levelInfo(xp){ let lv=1, need=150, rest=xp; while(rest>=need){ rest-=need; lv++; need+=50; } return {lv, rest, need, title:TITLES[Math.min(lv-1,TITLES.length-1)]}; }
function streak(){ const d=S.stats.days||{}; let n=0; const c=new Date(); if(!(d[dayKey(c)]>0)) c.setDate(c.getDate()-1); while(d[dayKey(c)]>0){ n++; c.setDate(c.getDate()-1); } return n; }
function addXp(n, el){
  if(!n) return; const k=today(); const before=S.stats.days[k]||0; const lvB=levelInfo(S.stats.xp).lv;
  S.stats.xp+=n; S.stats.days[k]=before+n; saveStats(); xpFly(n, el);
  if(before<S.stats.goal && before+n>=S.stats.goal){ confetti(); toast('🎉 Günlük hedef tamam! Seri devam ediyor 🔥',3500); }
  const L=levelInfo(S.stats.xp); if(L.lv>lvB){ confetti(); toast('⬆️ Seviye '+L.lv+': '+L.title+'!',3500); }
  hud();
}
const INT=[0,1,3,7,14,30,60]; // gün
const BOXL=['Yeni','1 gün','3 gün','1 hafta','2 hafta','1 ay','Öğrenildi'];
const BOXC=['#b9b2a6','#c23b36','#e07a2f','#e7a627','#8bb04a','#2d7a5f','#4a5bd1'];
function grade(it, q){ // q: again|hard|good
  const now=Date.now(); it.seen++; it.last=now;
  if(q==='again'){ it.box=1; it.due=now+10*60e3; it.wrong++; }
  else if(q==='hard'){ it.box=Math.max(1,it.box); it.due=now+Math.max(.5,INT[it.box]/2)*DAY; it.correct++; }
  else { it.box=Math.min(6,Math.max(1,it.box+1)); it.due=now+INT[it.box]*DAY; it.correct++; }
  it.updated=now; saveItem(it);
}
const isDue = it => it.seen>0 && it.due<=Date.now();

async function aiFill(btn){

  const ctx=$('#aEx').value.trim();
  const prompt=`Sen Türkiye'deki YDS (Yabancı Dil Bilgisi Seviye Tespit Sınavı) için İngilizce öğreten bir hocasın. Aşağıdaki İngilizce ifade için SADECE geçerli JSON döndür; başka metin yazma.
İfade: "${en}"
${ctx?`Geçtiği cümle (anlamı bu bağlama göre ver): "${ctx}"`:''}
Şema:
{"type":"kelime" ya da "kalip" (bağlaç öbeği, phrasal verb, edat öbeği, birden çok kelimeli kalıp ise "kalip"),
"tr":"Türkçe anlam(lar): en yaygın YDS anlamı önce, virgülle ayrılmış, kısa",
"example":"YDS okuma parçalarına benzer akademik bir İngilizce örnek cümle; ifadeyi aynen içersin",

"note":"çok kısa kullanım notu: kelime türü, nasıl kullanılır (ör. 'due to + isim/V-ing'), 1-2 eş anlamlı"}`;
  const old=btn.innerHTML; btn.innerHTML='<span class="spin"></span> Düşünüyor…'; btn.disabled=true;

    if(!o||!o.tr) throw {message:'parse'};

    if(!$('#aTr').value.trim()) $('#aTr').value=o.tr||'';

function aiErr(e){ const c=e&&e.code; if(c==='not_granted'){ document.body.classList.remove('has-ai'); toast('Claude yardımı bu görünümde kapalı.'); } else if(c==='rate_limited') toast('Biraz yavaşla 🙂 Bir dakika sonra tekrar dene.'); else toast('Claude cevabı alınamadı, tekrar dene.'); }
async function bulkAdd(btn){
  const lines=$('#bulkTxt').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!lines.length){ toast('Önce listeyi yapıştır.'); return; }
  const src=($('#aSrc')&&$('#aSrc').value.trim())||S.lastSource||'';
  const parsed=[]; let skipped=0;
  for(const l of lines){ const m=l.split(/\s*(?:\t|=|:|\s[-–—]\s)\s*/); const en=(m[0]||'').trim(); const tr=m.slice(1).join(', ').trim(); if(!en) continue; if(findDup(en)||parsed.some(p=>norm(p.en)===norm(en))){ skipped++; continue; } parsed.push({en,tr}); }
  const missing=parsed.filter(p=>!p.tr);
  if(missing.length && sample){
    btn.disabled=true; $('#bulkMsg').innerHTML='<span class="spin"></span> Claude '+missing.length+' anlamı dolduruyor…';
    for(let i=0;i<missing.length;i+=25){
      const chunk=missing.slice(i,i+25);
      const prompt=`YDS'ye hazırlanan bir öğrenci için aşağıdaki İngilizce ifadelerin her birine bilgi ver. SADECE geçerli JSON dizi döndür, sırayı koru.
İfadeler: ${JSON.stringify(chunk.map(c=>c.en))}
Her öğe: {"en":"ifadenin kendisi","type":"kelime"|"kalip","tr":"kısa Türkçe anlam(lar), en yaygın YDS anlamı önce","example":"akademik İngilizce örnek cümle, ifadeyi aynen içersin","exampleTr":"örneğin Türkçe çevirisi","note":"çok kısa kullanım notu"}`;
      try{ const r=await sample(prompt,{modelTier:'quick'}); const arr=parseJSON(r&&r.text); if(Array.isArray(arr)) chunk.forEach((c,k)=>{ const o=arr.find(a=>a&&norm(a.en)===norm(c.en))||arr[k]; if(o) Object.assign(c,{tr:o.tr||'',example:o.example||'',exampleTr:o.exampleTr||'',note:o.note||'',type:o.type}); }); }
      catch(e){ aiErr(e); break; }
    }
    btn.disabled=false;
  }
  let n=0, noTr=0;
  parsed.forEach(p=>{ if(!p.tr){ noTr++; return; } saveItem(mkItem({...p, type:p.type|| (/\s/.test(p.en)?'kalip':'kelime'), source:src})); n++; });
  if(n) addXp(Math.min(n*2,60), btn);
  $('#bulkMsg').textContent=`${n} eklendi`+(skipped?`, ${skipped} zaten vardı`:'')+(noTr?`, ${noTr} anlamsız satır atlandı`:'');
  const keep=parsed.filter(p=>!p.tr).map(p=>p.en); $('#bulkTxt').value=keep.join('\n');
  refreshEkleSide();
}

function renderDefList(){

let G=null, gTimer=null;
function getPool(){
  const f=S.pf, now=Date.now(); let p=S.items.slice();
  if(f.type!=='hepsi') p=p.filter(i=>i.type===f.type);
  if(f.src) p=p.filter(i=>i.source===f.src);
  if(f.scope==='gunluk'){ const due=p.filter(isDue).sort((a,b)=>a.due-b.due); const nw=p.filter(i=>!i.seen).sort((a,b)=>a.created-b.created).slice(0,10); p=due.concat(nw); }
  else if(f.scope==='yeni') p=p.filter(i=>!i.seen);
  else if(f.scope==='zor') p=p.filter(i=>i.seen && (i.wrong>=i.correct || i.box<=1));
  else if(f.scope==='son') p=p.filter(i=>i.created>now-7*DAY);
  return p;
}
function gapCore(en){ let c=String(en).split('/')[0].trim(); const m=c.search(/\b(sth|sb|smth|someone|something|somebody|one's|oneself)\b|\.{2,}|…/i); if(m>1) c=c.slice(0,m).trim(); c=c.replace(/^(be|to)\s+/i,'').trim(); return c; }
function phraseRe(en){ const c=gapCore(en); if(c.length<2) return null; return c.split(/\s+/).map(w=>escRe(w)+"[\\w']*").join('\\s+'); }
function findIn(sent, en){ const r=phraseRe(en); if(!r) return null; const m=new RegExp('\\b'+r,'i').exec(sent||''); return m? {i:m.index, len:m[0].length, txt:m[0]} : null; }

  if(k==='bosluk'){ const el=pool.filter(i=>i.example&&findIn(i.example,i.en)); const q=shuffle(el).slice(0,10).map(it=>mkGapQ(it)); G={k,q,i:0,ans:null,combo:0,best:0,ok:0,xp:0}; }
  if(k==='esle'){ const L=shuffle(pool).slice(0,15); const rounds=[]; for(let i=0;i<L.length;i+=5) rounds.push(L.slice(i,i+5)); if(rounds.length>1 && rounds[rounds.length-1].length<3){ const last=rounds.pop(); rounds[rounds.length-1].push(...last); } G={k, rounds, r:0, sel:null, done:new Set(), bad:new Set(), mist:0, t0:Date.now(), times:[], xp:0}; newRound(); gTimer=setInterval(()=>{ const t=$('#mTime'); if(t&&G) t.textContent=((Date.now()-G.t0)/1000).toFixed(1)+' sn'; },100); }

function distractors(it, field, n){
  const same=shuffle(S.items.filter(x=>x.id!==it.id && x.type===it.type && norm(x[field])!==norm(it[field])));
  const other=shuffle(S.items.filter(x=>x.id!==it.id && x.type!==it.type && norm(x[field])!==norm(it[field])));
  const out=[]; for(const x of same.concat(other)){ if(out.length>=n) break; if(!out.some(o=>norm(o[field])===norm(x[field]))) out.push(x); } return out;
}
function mkQ(it, dir){ const field=dir==='en'?'tr':'en'; const opts=shuffle([it, ...distractors(it, field, 3)]); return {it, dir, field, opts, right:opts.indexOf(it)}; }
function mkGapQ(it){ const opts=shuffle([it, ...distractors(it,'en',3)]); return {it, opts, right:opts.indexOf(it), m:findIn(it.example,it.en)}; }
function newRound(){ const R=G.rounds[G.r]; G.left=shuffle(R); G.right=shuffle(R); G.sel=null; G.bad=new Set(); G.rt0=Date.now(); }
function gameTop(cur, tot, extra=''){ return `<div class="game-top"><button class="btn sm ghost" data-act="quitGame">✕</button><div class="prog"><i style="width:${tot?cur/tot*100:0}%"></i></div><span class="small muted">${cur}/${tot}</span>${extra}</div>`; }

    return;

/* game actions */
function rate(q){
  const it=G.q[G.i]; grade(it,q); G.res[q]++;
  const x={good:10,hard:6,again:2}[q]; addXp(x, $('.flash'));
  if(q==='again'){ G.re[it.id]=(G.re[it.id]||0)+1; if(G.re[it.id]<=2) G.q.splice(Math.min(G.i+4,G.q.length),0,it); }
  G.i++; G.flip=false; drawGame();
}
function answer(k){
  if(G.ans!==null) return; const Q=G.q[G.i]; G.ans=k; const ok=k===Q.right;
  if(ok){ G.combo++; G.best=Math.max(G.best,G.combo); G.ok++; grade(Q.it,'good'); drawGame(); addXp(10+Math.min((G.combo-1)*2,10), $('.opt.right')); }
  else { G.combo=0; grade(Q.it,'again'); drawGame(); }
}
function nextQ(){ G.i++; G.ans=null; drawGame(); }
function mL(id){ if(G.done.has(id)) return; G.sel=id; drawGame(); }
function mR(id, el){
  if(!G.sel || G.done.has(id)) return;
  const L=G.rounds[G.r].find(x=>x.id===G.sel);
  if(id===G.sel){
    G.done.add(G.sel); if(!G.bad.has(G.sel)) grade(L,'good'); G.sel=null; G.xp+=5; addXp(5, el);
    if(G.rounds[G.r].every(x=>G.done.has(x.id))){
      G.times.push(Date.now()-G.rt0);
      if(G.r+1<G.rounds.length){ G.r++; newRound(); drawGame(); }
      else { const tot=Date.now()-G.t0; const per5=Math.min(...G.times.map((t,i)=>t*5/G.rounds[i].length)); let rec=false; if(!S.stats.bestMatch||per5<S.stats.bestMatch){ S.stats.bestMatch=Math.round(per5); saveStats(); rec=true; } if(G.mist===0) addXp(15); setTimeout(()=>finish(`<div class="grid g3"><div class="card center"><div class="big">${(tot/1000).toFixed(1)}</div>saniye</div><div class="card center"><div class="big" style="color:${G.mist?'var(--bad)':'var(--ok)'}">${G.mist}</div>hata${G.mist?'':' (+15 XP bonus)'}</div>${rec?'<div class="card center"><div class="big">🏆</div>Yeni rekor!</div>':''}</div>`),300); drawGame(); }
    } else drawGame();
  } else {
    G.mist++; if(!G.bad.has(G.sel)){ G.bad.add(G.sel); grade(L,'again'); }
    el.classList.add('shake'); const l=document.querySelector(`.tile[data-act=mL][data-id="${G.sel}"]`); l&&l.classList.add('shake');
    setTimeout(()=>{ el.classList.remove('shake'); l&&l.classList.remove('shake'); },380);
  }
}
function checkWrite(){
  const it=G.q[G.i]; const given=$('#wIn').value; const g=norm(given); if(!g){ $('#wIn').focus(); return; }
  const targets=[...new Set(it.en.split('/').map(s=>norm(s)).concat([norm(it.en.replace(/\([^)]*\)/g,'')), norm(it.en.replace(/[()]/g,''))]).filter(Boolean))];
  let ok=false, typo=false;
  for(const t of targets){ if(g===t){ ok=true; typo=false; break; } const d=lev(g,t); if((d<=1&&t.length>=5)||(d<=2&&t.length>=11)){ ok=true; typo=true; } }
  G.ans={ok,typo,given};
  if(ok){ G.ok++; grade(it, typo||G.hint?'hard':'good'); drawGame(); addXp(Math.max(4,(typo?10:14)-G.hint*2), $('.fb')); }
  else { grade(it,'again'); drawGame(); }
}
function nextW(){ G.i++; G.hint=0; G.ans=null; drawGame(); }

async function analyze(btn, t){
  if(!sample){ toast('Claude yardımı kullanılamıyor.'); return; }
  const body=t.body.slice(0,4000);
  const prompt=`Sen YDS'ye (Türkiye) hazırlanan bir öğrencinin okuma ve çeviri hocasısın. Öğrencinin hedefi 55+ puan. Aşağıdaki İngilizce metni YDS hocası gibi çözümle. SADECE geçerli JSON döndür, başka hiçbir şey yazma.
METİN:
"""${body}"""
${t.my?`ÖĞRENCİNİN ÇEVİRİSİ:\n"""${t.my.slice(0,4000)}"""`:''}
Şema:
{"mainIdea":"metnin ana fikri, 1-2 cümle Türkçe",
"sentences":[{"en":"orijinal cümle (aynen)","tr":"doğal, akıcı Türkçe çeviri","structure":"cümlenin iskeleti: asıl özne + asıl yüklem, bağlaçlar ve yan cümleler (which/that/although…), zaman/edilgen yapı; çeviride nereden başlanmalı. Kısa ve Türkçe."}],
"items":[{"en":"metindeki önemli kelime veya kalıp (sözlük hali)","type":"kelime"|"kalip","tr":"metindeki anlamıyla kısa Türkçe karşılık","note":"çok kısa not (kelime türü, kullanım, eş anlamlı)"}],
"feedback":${t.my?'"öğrencinin çevirisine nazik ama net geri bildirim: doğru yaptıkları, anlam hataları, atladığı yerler ve nasıl düzeltileceği; 3-6 madde, Türkçe"':'""'}}
Kurallar: sentences tüm cümleleri sırayla kapsasın. items 8-20 öğe olsun; YDS'de sık çıkan akademik kelimeler, bağlaçlar, edat öbekleri, phrasal verb'ler öncelikli; çok basit kelimeleri (the, people, make vb.) alma.`;
  const old=btn.innerHTML; btn.disabled=true; btn.innerHTML='<span class="spin"></span> Çözümleniyor…';
  try{
    const r=await sample(prompt,{modelTier:'default', onText:({text})=>{ btn.innerHTML='<span class="spin"></span> Çözümleniyor… ('+text.length+' karakter)'; }});
    const o=parseJSON(r&&r.text);
    if(!o||!Array.isArray(o.sentences)) throw {message:'parse'};
    t.analysis={mainIdea:String(o.mainIdea||''), sentences:o.sentences.slice(0,60).map(s=>({en:String(s.en||''),tr:String(s.tr||''),structure:String(s.structure||'')})), items:(o.items||[]).slice(0,30).map(x=>({en:String(x.en||''),type:x.type==='kalip'?'kalip':'kelime',tr:String(x.tr||''),note:String(x.note||'')})).filter(x=>x.en&&x.tr), feedback:String(o.feedback||''), at:Date.now(), forMy:t.my||''};
    saveText(t); S.metinOpen=t.id; addXp(15); render();
  }catch(e){ aiErr(e); btn.disabled=false; btn.innerHTML=old; }
}
function hlText(text){
  const its=S.items.filter(i=>phraseRe(i.en)).sort((a,b)=>gapCore(b.en).length-gapCore(a.en).length).slice(0,600);
  if(!its.length) return esc(text);
  let re; try{ re=new RegExp(its.map(i=>'\\b('+phraseRe(i.en)+')').join('|'),'gi'); }catch(e){ return esc(text); }
  let out='', last=0, m;
  while((m=re.exec(text))){ if(!m[0]){ re.lastIndex++; continue; } let gi=1; while(gi<m.length && m[gi]===undefined) gi++; const it=its[gi-1]; out+=esc(text.slice(last,m.index))+`<mark class="hl" title="${esc(it.tr)}" data-act="hlTip" data-id="${it.id}">${esc(m[0])}</mark>`; last=m.index+m[0].length; }
  return out+esc(text.slice(last));
}

 tani:['It is + sıfat + to V / that: “It is essential to reduce waste.” = “Atığı azaltmak çok önemlidir.”','It is believed / estimated that … = “… -dığına inanılıyor / tahmin ediliyor.”','Vurgu: “It was the doctor who …” = “… -en doktordu.”','It was not until X that Y = “Y ancak X’te oldu.”','There is / are = “… var”; There seems to be = “… var gibi görünüyor.”'],
 cevir:['Boş özne “it”i “o” diye çevirme, hiç çevirme.'],
 ex:[['It was not until the 19th century that the cause of the disease was discovered.','Hastalığın nedeni ancak 19. yüzyılda keşfedildi.'],['It is estimated that over one billion people lack access to clean water.','Bir milyardan fazla insanın temiz suya erişimi olmadığı tahmin ediliyor.']],
 tuzak:['“It” her zaman bir şeye gönderme yapmaz; boş özneyse çeviride kaybolur.'],
 quiz:[['It was not until 1928 ___ penicillin was discovered.',['when','that','which','since'],1,'Kalıp: It was not until X THAT Y.'],
  ['“It is widely believed that diet affects mood.” en iyi çeviri?',['O, diyetin ruh halini etkilediğine yaygın olarak inanır.','Beslenmenin ruh halini etkilediğine yaygın olarak inanılıyor.','Beslenme ruh halini yaygın olarak etkiler.','Yaygın bir inanç beslenmeyi etkiler.'],1,'It is believed that = “… -dığına inanılıyor” (edilgen, boş özne).']]},
{id:'paralel',g:'yapi',t:'Çift bağlaçlar ve paralel yapı',s:'both…and, either…or, neither…nor, not only…but also: iki taraf aynı yapıda olur.',k:'both and either or neither nor not only but also paralel',
 sig:['\\bboth\\b[^.]*\\band\\b','\\beither\\b[^.]*\\bor\\b','\\bneither\\b[^.]*\\bnor\\b','\\bnot only\\b','\\bas well as\\b'],
 tani:['both X and Y = hem X hem Y','either X or Y = ya X ya Y','neither X nor Y = ne X ne Y','not only X but (also) Y = sadece X değil, Y de','whether X or Y = X de olsa Y de olsa','X as well as Y = Y’nin yanı sıra X'],
 cevir:[],ex:[['The disease affects not only the lungs but also the heart.','Hastalık sadece akciğerleri değil, kalbi de etkiler.']],
 tuzak:['neither … nor zaten olumsuzdur; ayrıca not kullanılmaz.','Not only cümle başındaysa devrik gelir: “Not only does it …”.'],
 quiz:[['The new drug is ___ cheaper ___ more effective than the old one.',['either / or','both / and','neither / or','not / but'],1,'“hem daha ucuz hem daha etkili” → both … and.'],
  ['___ the government ___ the opposition supported the bill, so it failed.',['Both / and','Either / or','Neither / nor','Not only / but also'],2,'Tasarı başarısız oldu → kimse desteklemedi: Neither … nor.']]},
{id:'zamanlar',g:'fiil',t:'Zamanlar: YDS’de kritik olanlar',s:'Zaman uyumu cümle tamamlama ve çeviride en çok kullanılan ipucudur.',k:'tense zaman present perfect past perfect future since for by the time',
 sig:['\\b(has|have)\\s+(been\\s+)?\\w+(ed|en|wn|ght|ne|un|ung)\\b','\\bhad\\s+(been\\s+)?\\w+(ed|en|wn|ght|ne|un|ung)\\b','\\bwill have\\b','\\bby the time\\b','\\b(over|in|during) the (past|last)\\b'],
 tani:['<b>Present perfect</b> (has / have V3): geçmişten bugüne. “-dı / -mıştır”. İpuçları: since, for, recently, so far, over the past decade.','<b>Past perfect</b> (had V3): geçmişteki bir olaydan DAHA ÖNCE. “-mıştı”. İpucu: by the time + past.','<b>Future perfect</b> (will have V3): gelecekteki bir noktaya kadar tamamlanmış. “-mış olacak”. İpucu: by 2050.','<b>Geniş zaman:</b> genel gerçekler, bilimsel bilgi. “-r / -dır”.','<b>Past simple:</b> geçmişte bitmiş, zamanı belli. İpuçları: in 1990, ago, last year.'],
 cevir:['Önce zaman ifadelerini ara (since, by the time, until, ago, over the last …): zamanı bunlar ele verir.'],
 ex:[['By the time the firefighters arrived, the building had collapsed.','İtfaiyeciler geldiğinde bina çökmüştü.'],['Global temperatures have risen by about 1°C since 1900.','Küresel sıcaklıklar 1900’den bu yana yaklaşık 1°C arttı.']],
 tuzak:['since + geçmiş zaman, ana cümle present perfect: “has increased since it was introduced”.','by the time + geniş zaman → ana cümle will have V3; by the time + past → had V3.'],
 quiz:[['Since the treatment was introduced, mortality rates ___ significantly.',['decreased','have decreased','had decreased','will decrease'],1,'since → ana cümle present perfect.'],
  ['By the time the report was published, the company ___ its strategy.',['changes','has changed','had changed','will change'],2,'by the time + past → had V3.'],
  ['By 2050, the world population ___ nearly 10 billion.',['reaches','reached','will have reached','had reached'],2,'Gelecekte bir noktaya kadar → will have V3.']]},
{id:'edilgen',g:'fiil',t:'Edilgen yapı (Passive)',s:'be + V3: kimin yaptığı değil, ne yapıldığı önemli. Akademik metinlerde çok sık.',k:'passive edilgen be v3 is said to',
 sig:['\\b(is|are|was|were|be|been|being)\\s+(\\w+ly\\s+)?\\w+(ed|en|wn|ght|ne|lt|pt|un|ung)\\b(?!\\s+(to|that)\\b)','\\b(is|are|was|were)\\s+(said|thought|believed|known|reported|considered|expected|estimated)\\s+to\\b'],
 tani:['is / are / was / were + V3 · has been / had been + V3 · will be / can be / must be + V3 · is being + V3 (yapılmakta)','by + kişi = “… tarafından”','is said / believed / thought to V = “… -dığı söyleniyor / düşünülüyor”','is thought to have V3 = “… -mış olduğu düşünülüyor”'],
 cevir:['Türkçede “-ıl / -ın” eki: is used = kullanılır · was found = bulundu · has been shown = gösterilmiştir.'],
 ex:[['The vaccine is thought to have saved millions of lives.','Aşının milyonlarca hayat kurtarmış olduğu düşünülüyor.'],['More research needs to be done before the drug can be approved.','İlaç onaylanmadan önce daha fazla araştırma yapılması gerekiyor.']],
 tuzak:['“is to V” (yapılacak / yapılmalı) edilgen değildir.','to V3 ile to have V3 farkı çeviri sorularında çıkar: “-dığı” ↔ “-mış olduğu”.'],
 quiz:[['Thousands of new species ___ every year.',['discover','are discovered','are discovering','have discovered'],1,'Türler keşfedilir → edilgen.'],
  ['The pyramids are believed ___ by skilled workers, not slaves.',['to build','to be built','to have been built','building'],2,'Geçmişte yapılmış + edilgen → to have been built.']]},
{id:'modal',g:'fiil',t:'Modal’lar: kesinlik derecesi',s:'Çeviride “-ebilir” ile “-meli” farkı şıkkı değiştirir.',k:'modal may might could must should would have v3 olasılık',
 sig:['\\b(may|might|could|must|should|would|cannot|can\'t|needn\'t|need not)\\s+(not\\s+)?have\\s+\\w+(ed|en|wn|ght|ne|un|ung)\\b','\\b(may|might|must|should|ought to)\\b'],
 tani:['may / might / could + V = -ebilir (olasılık)','must + V = -meli (zorunluluk) ya da kesin çıkarım (“-iyor olmalı”)','can = -ebilir (yetenek / olanak); cannot = -emez','should / ought to = -meli (tavsiye) · would = -erdi','<b>may / might / could have V3</b> = -mış olabilir','<b>must have V3</b> = -mış olmalı (kesin çıkarım)','<b>should have V3</b> = -meliydi (ama yapmadı)','<b>could have V3</b> = -ebilirdi (ama olmadı)','<b>needn’t have V3</b> = gerek yoktu ama yaptı · <b>cannot have V3</b> = -mış olamaz'],
 cevir:[],ex:[['The ancient city must have been abandoned after the earthquake.','Antik kent depremden sonra terk edilmiş olmalı.'],['The government should have acted sooner.','Hükümet daha erken harekete geçmeliydi.']],
 tuzak:['may have V3 (olmuş olabilir) ≠ could have V3 (olabilirdi ama olmadı).','be able to = can; be likely to = muhtemelen -ecek.'],
 quiz:[['The dinosaurs ___ extinct because of a meteor impact, but there are other theories.',['must have become','might have become','should have become','cannot have become'],1,'“Başka teoriler de var” → kesin değil, olasılık: might have V3.'],
  ['“You should have consulted a doctor.” anlamı?',['Doktora danışmalısın.','Doktora danışmalıydın (ama danışmadın).','Doktora danışmış olabilirsin.','Doktora danışman gerekmedi.'],1,'should have V3 = yapılması gerekirdi ama yapılmadı.']]},
{id:'ing-to',g:'fiil',t:'-ing / to V ve kalıplaşmış yapılar',s:'Fiilden sonra -ing mi, to V mi? Gramer sorularının klasiği.',k:'gerund infinitive ing to too enough used to likely tend',
 sig:['\\b(is|are|was|were|be)\\s+(likely|unlikely|supposed|bound|expected|able)\\s+to\\b','\\btoo\\s+\\w+\\s+to\\b','\\b\\w+\\s+enough\\s+to\\b','\\bused to\\b','\\btends?\\s+to\\b','\\b(by|without|instead of|despite|before|after|in addition to)\\s+\\w+ing\\b'],
 tani:['to V = amaç: “to reduce costs” = “maliyetleri düşürmek için”','be likely / unlikely to = muhtemelen -ecek / -meyecek','be supposed to = -mesi gerekiyor / bekleniyor','too + sıfat + to V = … -emeyecek kadar …','sıfat + enough to V = … -ecek kadar …','used to V = eskiden -erdi · be used to V-ing = -meye alışkın · be used to V = -mek için kullanılır','tend to V = -me eğiliminde','Edattan sonra hep V-ing: by doing (-erek), without doing (-meden), instead of, despite, before / after doing','-ing alanlar: avoid, enjoy, consider, involve, risk, deny, keep · to V alanlar: aim, attempt, fail, manage, tend, seem, refuse, decide'],
 cevir:[],ex:[['The particles are too small to be seen with the naked eye.','Parçacıklar çıplak gözle görülemeyecek kadar küçük.'],['People tend to underestimate the risks they are used to living with.','İnsanlar birlikte yaşamaya alışkın oldukları riskleri hafife alma eğilimindedir.']],
 tuzak:['“to” edat olduğunda ardından V-ing gelir: look forward to doing, be used to doing, contribute to doing, object to doing.'],
 quiz:[['Many patients avoid ___ to the doctor until symptoms become serious.',['go','to go','going','gone'],2,'avoid + V-ing.'],
  ['The bridge was not strong enough ___ heavy trucks.',['carrying','to carry','carry','carried'],1,'enough + to V.']]},
{id:'zitlik',g:'baglac',t:'Zıtlık bağlaçları',s:'Cümle tamamlamada “beklenmedik sonuç” = zıtlık bağlacı.',k:'although though despite in spite of however whereas while nevertheless zıtlık',
 sig:['\\b(although|though|even though|whereas|despite|in spite of|however|nevertheless|nonetheless|albeit|conversely|notwithstanding|on the other hand|in contrast|even so)\\b','\\bwhile\\b','\\byet\\b'],
 tani:['<b>+ cümle:</b> although, even though, though, while, whereas, even if','<b>+ isim / V-ing:</b> despite, in spite of, notwithstanding','<b>Cümleler arası:</b> however, nevertheless, nonetheless, yet, still, on the other hand, in contrast, conversely','albeit + sıfat / zarf: “-se de”'],
 cevir:['although / despite = “-e rağmen / -dığı halde” · while / whereas = “-iken / oysa” · however = “ancak, fakat”'],
 ex:[['Although the treatment is expensive, it is widely used.','Tedavi pahalı olmasına rağmen yaygın olarak kullanılıyor.']],
 tuzak:['despite cümle almaz → “despite the fact that + cümle”.','while “-iken” (zaman) anlamında da olabilir; bağlama bak.'],
 quiz:[['___ the drug proved effective in trials, it was never approved because of its side effects.',['Because','Although','Unless','Since'],1,'Etkili ama onaylanmadı → beklenmedik sonuç: Although.'],
  ['___ heavy investment, the project failed.',['Although','Despite','However','Even though'],1,'Ardından isim geliyor → Despite.']]},
{id:'sebep',g:'baglac',t:'Sebep – sonuç bağlaçları',s:'Sebep mi, sonuç mu? Okun yönüne dikkat et.',k:'because due to owing to therefore thus hence result in lead to sebep sonuç',
 sig:['\\b(because|due to|owing to|on account of|as a result|therefore|thus|hence|consequently|accordingly|now that|given that|thanks to)\\b','\\bso\\s+\\w+\\s+that\\b','\\b(results?|resulted|resulting)\\s+(in|from)\\b','\\b(lead|leads|led|leading)\\s+to\\b','\\b(stems?|stemmed|arises?|arose)\\s+from\\b'],
 tani:['<b>Sebep + cümle:</b> because, since, as, now that, given that','<b>Sebep + isim:</b> because of, due to, owing to, on account of, as a result of, thanks to','<b>Sonuç:</b> so, therefore, thus, hence, consequently, as a result, accordingly','so / such … that = “o kadar … ki”','Sebep → sonuç: result in, lead to, cause, bring about · Sonuç ← sebep: result from, stem from, arise from'],
 cevir:[],ex:[['The soil was so dry that nothing could grow.','Toprak o kadar kuruydu ki hiçbir şey yetişemiyordu.']],
 tuzak:['since “-den beri” de olabilir; as “-dığı için / -iken / gibi” anlamlarına gelebilir.','so that = amaç (-sın diye); so = sonuç.'],
 quiz:[['The experiment had to be repeated ___ the equipment was faulty.',['although','because','so that','unless'],1,'Ekipman bozuktu → sebep: because.'],
  ['Air pollution can ___ serious respiratory diseases.',['result from','result in','stem from','arise from'],1,'Kirlilik (sebep) → hastalık (sonuç): result in.']]},
{id:'kosul',g:'baglac',t:'Koşul cümleleri ve koşul bağlaçları',s:'if’in türü zamanı ve gerçekliği belirler.',k:'if conditional koşul unless provided otherwise were it not had it not been',
 sig:['\\bif\\b','\\bunless\\b','\\b(provided|providing)( that)?\\b','\\bas long as\\b','\\bin case\\b','\\botherwise\\b','\\bwere it not\\b','\\bhad it not been\\b','\\bbut for\\b','^\\s*(had|were|should)\\s+(it|they|we|the|this|he|she|you|i)\\b'],
 tani:['<b>Type 0 / 1:</b> If + geniş zaman → geniş zaman / will: gerçek olasılık. “-rsa … -r / -ecek”','<b>Type 2:</b> If + past → would V: şu anki hayali durum. “-saydı … -erdi”','<b>Type 3:</b> If + had V3 → would have V3: geçmişteki hayali durum. “-mış olsaydı … -mış olurdu”','<b>Karışık:</b> If + had V3 → would V (şimdi): “… -seydi şimdi -erdi”','unless = if not · provided (that) / as long as / on condition that = -mesi şartıyla · in case = -ihtimaline karşı · otherwise = aksi takdirde · even if = -se bile','<b>if’siz devrik:</b> Were it not for X / But for X = X olmasaydı · Had it not been for X = X olmasaydı (geçmiş) · Should you need = ihtiyacınız olursa'],
 cevir:[],ex:[['Had the warning been taken seriously, the disaster could have been prevented.','Uyarı ciddiye alınsaydı felaket önlenebilirdi.']],
 tuzak:['unless zaten olumsuzdur: “unless it does not …” deme.','Type 2 / 3 gerçek değildir: çeviride “aslında olmadı” anlamını koru.'],
 quiz:[['If the company ___ more in research, it would not have lost its market share.',['invests','invested','had invested','would invest'],2,'would have V3 → Type 3: If + had V3.'],
  ['___ the support of volunteers, the project would have failed.',['Unless','Were it not','Had it not been for','Provided'],2,'Geçmişteki hayali durum + isim → Had it not been for.'],
  ['The drug is safe ___ it is taken in the recommended dose.',['unless','provided that','in case','otherwise'],1,'“… alınması şartıyla güvenli” → provided that.']]},
{id:'amac',g:'baglac',t:'Amaç bağlaçları',s:'“-mek için / -sın diye”.',k:'amaç so that in order to so as to lest',
 sig:['\\bin order to\\b','\\bso as (not )?to\\b','\\bso that\\b','\\bin order that\\b','\\bfor fear that\\b','\\blest\\b','\\bwith a view to\\b'],
 tani:['to V · in order to V · so as to V (olumsuz: so as not to)','so that + cümle (can / could / will / would ile) = -sın diye, -ebilmek için','in order that · for fear that / lest = -mesin diye','with a view to V-ing = -mek amacıyla'],
 cevir:[],ex:[['Samples were stored at low temperatures so that they would not deteriorate.','Numuneler bozulmasın diye düşük sıcaklıkta saklandı.']],
 tuzak:['so that (amaç) ≠ so … that (o kadar … ki).'],
 quiz:[['The data were anonymised ___ participants could not be identified.',['so that','such that','in order to','because'],0,'Ardından cümle + amaç → so that.'],
  ['Researchers wore protective suits ___ contaminate the samples.',['so as not to','in order to','so that','so as'],0,'Amaç olumsuz + fiil → so as not to.']]},
{id:'karsilastirma',g:'baglac',t:'Karşılaştırmalar',s:'Şıklarda “daha az / daha çok” ve “kadar” karışır; dikkat.',k:'comparative than as as the more the more karşılaştırma',
 sig:['\\bthe\\s+(more|less|\\w+er)\\b[^.]*,\\s*the\\s+(more|less|\\w+er)\\b','\\bas\\s+\\w+\\s+as\\b','\\b(more|less|fewer)\\b[^.]{0,40}\\bthan\\b','\\b\\w+er\\s+than\\b','\\b(twice|three times|half)\\s+as\\b'],
 tani:['-er / more … than = -den daha · less … than = -den daha az','as … as = … kadar · not as / so … as = … kadar değil','the -est / the most = en','the more …, the more … = ne kadar çok … o kadar çok','twice as … as = iki katı · much / far / considerably + -er = çok daha','no longer = artık … değil · no more than = en fazla, sadece'],
 cevir:[],ex:[['The more people use public transport, the less traffic there will be.','İnsanlar toplu taşımayı ne kadar çok kullanırsa o kadar az trafik olur.']],
 tuzak:['“not as … as” → “… kadar … değil”: olumsuzluğu kaybetme.','less sayılamayan, fewer sayılabilen isimle kullanılır.'],
 quiz:[['___ a material is, the more heat it can store.',['Denser','The denser','The densest','As dense'],1,'the + -er …, the more … yapısı.'],
  ['The new model uses ___ energy than the old one.',['fewer','less','least','little'],1,'energy sayılamaz + than → less.']]},
{id:'devrik',g:'ozel',t:'Devrik yapı (Inversion)',s:'Olumsuz / sınırlayıcı ifade cümle başına gelince soru düzeni kurulur; vurgu yapar.',k:'inversion devrik never rarely hardly no sooner only after not until',
 sig:['^\\s*(never|rarely|seldom|little|hardly|scarcely|barely|nowhere|under no circumstances|in no way|at no time)\\s+(do|does|did|is|are|was|were|has|have|had|can|could|will|would|should|must)\\b','^\\s*not only\\s+(do|does|did|is|are|was|were|has|have|had|can|could|will|would)\\b','^\\s*only\\s+(after|when|if|by|then|in|once|recently)\\b[^.]*\\b(do|does|did|is|are|was|were|has|have|had|can|could|will|would)\\s+\\w+','^\\s*not until\\b','\\bno sooner\\b','^\\s*so\\s+\\w+\\s+(is|are|was|were)\\b'],
 tani:['Never / Rarely / Seldom / Little + yardımcı fiil + özne: “Never have I seen …” = “Hiç … görmedim.”','Not only + did … but also = “Sadece … değil …”','Hardly / Scarcely … when; No sooner … than = “… -er -mez”','Only after / when / if … + devrik = “Ancak … -dıktan sonra”','Not until … + devrik = “Ancak … olunca”','Under no circumstances = “Hiçbir koşulda” · So + sıfat + be + özne + that = “O kadar … ki”'],
 cevir:[],ex:[['No sooner had the experiment started than the power went out.','Deney başlar başlamaz elektrik kesildi.'],['Only after the data were reanalysed did the error become clear.','Hata ancak veriler yeniden analiz edildikten sonra ortaya çıktı.']],
 tuzak:['Devrik cümle soru değildir; soru işareti arama.','Little did they know = “hiç bilmiyorlardı” (olumsuz anlam).'],
 quiz:[['Rarely ___ such a rapid recovery in a patient.',['doctors see','do doctors see','doctors do see','did doctors saw'],1,'Rarely başta → devrik: do + özne + V.'],
  ['“Hardly had the meeting begun when the fire alarm went off.” anlamı?',['Toplantı zar zor başladı ve alarm çaldı.','Toplantı başlar başlamaz yangın alarmı çaldı.','Toplantı başlamadan alarm çaldı.','Toplantı başladığında alarm çalmıyordu.'],1,'Hardly … when = “-er -mez”.']]},
{id:'zamir',g:'ozel',t:'Zamirler ve gönderim (this, they, the former / latter)',s:'Paragraf, cloze ve anlam bütünlüğü sorularında “bu kime gidiyor?” sorusu çözer.',k:'zamir pronoun reference this these former latter they it gönderim',
 sig:['\\bthe (former|latter)\\b','\\b(this|these|such)\\s+(finding|findings|result|results|approach|method|process|problem|view|idea|phenomenon|trend|change|changes|effect|effects|study|discovery)\\b','\\bdo so\\b'],
 tani:['this / these + isim = önceki cümledeki fikre gönderme: “This finding …” = “Bu bulgu …”','they / them / their = önceki çoğul isim · it / its = tekil isim','the former = ilki · the latter = ikincisi','such + isim = böyle bir · do so = bunu yapmak · one / ones = aynı türden biri'],
 cevir:['Zamiri gördüğünde önceki cümlede kime gittiğini bul; gerekirse çeviride açıkça yaz.'],
 ex:[['Both coffee and tea contain caffeine, but the latter also contains antioxidants.','Hem kahve hem çay kafein içerir, ancak ikincisi (çay) antioksidan da içerir.']],
 tuzak:['Paragraf tamamlama ve anlamı bozan cümle sorularında zamir uyumu (tekil / çoğul) en hızlı eleme yöntemidir.'],
 quiz:[['Plants and animals both need water, but ___ can also produce their own food.',['the former','the latter','the formers','they latter'],0,'Kendi besinini üreten bitkiler = ilk söylenen → the former.'],
  ['“Many cities have introduced bike lanes. This has reduced traffic.” “This” neyi gösteriyor?',['şehirleri','bisiklet yollarının getirilmesini','trafiği','bisikletleri'],1,'this önceki cümlenin fikrini (bisiklet yolu getirilmesi) gösterir.']]}
];
GRAMMAR.forEach(c=>{ c._re=(c.sig||[]).map(s=>{ try{ return new RegExp(s,'i'); }catch(e){ return null; } }).filter(Boolean); c._txt=norm([c.t,c.s,c.k,...c.tani,...c.cevir,...c.tuzak,...c.ex.flat()].join(' ').replace(/<[^>]+>/g,' ')); });
const cardById=id=>GRAMMAR.find(c=>c.id===id);
function splitSent(t){ return String(t||'').replace(/\s+/g,' ').split(/(?<=[.!?])\s+(?=[A-Z“"(])/).map(s=>s.trim()).filter(Boolean); }
function detectIn(sentence){ const out=[]; for(const c of GRAMMAR){ for(const r of c._re){ const m=r.exec(sentence); if(m){ out.push({c, m:m[0]}); break; } } } return out; }
function detectStructures(text){
  const res=new Map();
  splitSent(text).forEach(s=>detectIn(s).forEach(({c,m})=>{ const e=res.get(c.id)||{c,n:0,ex:[]}; e.n++; if(e.ex.length<3) e.ex.push(m.trim()); res.set(c.id,e); }));
  return [...res.values()].sort((a,b)=>b.n-a.n);
}
function structChips(text, small){
  const d=detectStructures(text); if(!d.length) return small?'':'<p class="small muted" style="margin:0">Belirgin bir yapı bulunamadı.</p>';
  return `<div class="row" style="gap:6px">${d.map(e=>`<button class="btn sm ${small?'ghost':''}" data-act="openCard" data-id="${e.c.id}" title="${esc(e.ex.join(' · '))}">${small?'':'📘 '}${esc(e.c.t.split(':')[0].split('(')[0].trim())}${small?'':' <span class="muted">×'+e.n+'</span>'}</button>`).join('')}</div>`;
}

/* ---------- Rehber view ---------- */
function vRehber(){
  const R=S.r;
  if(R.open){ const c=cardById(R.open); if(c) return rehberCard(c); R.open=null; }
  $('#main').innerHTML=`<div class="stack">
  <div class="card stack"><div><h2 style="margin:0">Rehber</h2><div class="small muted">Metin çevirirken takıldığın yapıyı buradan bul. Her kartta tanıma ipuçları, çeviri kalıbı, YDS tuzakları ve mini test var.</div></div>
    <input class="in" id="rQ" placeholder="🔎 Metinde ne gördün? ör. which, had been, unless, despite, -ing" value="${esc(R.q)}">
    <div class="row" id="rG"><button class="btn sm ${!R.g?'pri':''}" data-g="">Hepsi</button>${Object.entries(GROUPS).map(([k,v])=>`<button class="btn sm ${R.g===k?'pri':''}" data-g="${k}">${v}</button>`).join('')}</div>
  </div>
  <details class="card" id="scanBox" ${R.scan?'open':''}><summary>🧭 Yapı tarayıcı — cümleyi yapıştır, içindeki yapıları bulayım</summary>
    <textarea class="in" id="scanIn" rows="3" style="margin-top:10px" placeholder="Takıldığın cümleyi buraya yapıştır…">${esc(R.scan||'')}</textarea>
    <div id="scanOut" style="margin-top:10px"></div></details>
  <div id="rList" class="grid g2"></div></div>`;
  $('#rQ').oninput=e=>{ R.q=e.target.value; rList(); };
  $('#rG').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; R.g=b.dataset.g; [...$('#rG').children].forEach(x=>x.classList.toggle('pri',x===b)); rList(); };
  const scan=()=>{ R.scan=$('#scanIn').value; $('#scanOut').innerHTML=R.scan.trim()?structChips(R.scan):''; };
  $('#scanIn').oninput=scan; scan(); rList();
}
function rList(){
  const R=S.r, el=$('#rList'); if(!el) return; const q=norm(R.q); const words=q.split(' ').filter(Boolean);
  const L=GRAMMAR.filter(c=>(!R.g||c.g===R.g)&&(!q||words.every(w=>c._txt.includes(w))||c._re.some(r=>r.test(R.q))));
  el.innerHTML=L.length?L.map(c=>{ const n=S.gnotes[c.id]; return `<div class="item" data-act="openCard" data-id="${c.id}" style="margin:0"><div class="small muted">${GROUPS[c.g]}</div><div class="en" style="font-size:16px">${esc(c.t)}</div><div class="small muted">${esc(c.s)}</div><div class="row small" style="margin-top:6px;gap:6px">${c.quiz.length?`<span class="chip ${n&&n.best===c.quiz.length?'kalip':'src'}">${n&&n.best!=null?`test ${n.best}/${c.quiz.length}`:`${c.quiz.length} soruluk test`}</span>`:''}${n&&n.text?'<span class="chip src">📝 notun var</span>':''}</div></div>`; }).join(''):'<div class="card empty" style="grid-column:1/-1"><p class="muted">Eşleşen not yok. Başka bir kelimeyle dene.</p></div>';
}
function rehberCard(c){
  const R=S.r, n=S.gnotes[c.id]||{}, Q=R.quiz&&R.quiz.id===c.id?R.quiz:null;
  const li=a=>a.length?`<ul style="margin:6px 0 0;padding-left:20px">${a.map(x=>`<li style="margin:4px 0">${x}</li>`).join('')}</ul>`:'';
  let quizHTML='';
  if(c.quiz.length){
    if(!Q) quizHTML=`<div class="row"><button class="btn pri" data-act="cardQuiz" data-id="${c.id}">✅ Mini testi başlat (${c.quiz.length} soru)</button>${n.best!=null?`<span class="small muted">En iyi: ${n.best}/${c.quiz.length}</span>`:''}</div>`;
    else if(Q.i>=c.quiz.length) quizHTML=`<div class="fb ${Q.ok===c.quiz.length?'ok':'no'}"><b>${Q.ok}/${c.quiz.length}</b> doğru. ${Q.ok===c.quiz.length?'Harika! 🎉':'Notları bir daha oku, sonra tekrar dene.'}</div><div class="row" style="margin-top:8px"><button class="btn" data-act="cardQuiz" data-id="${c.id}">Tekrar çöz</button></div>`;
    else { const [q,opts,a,why]=c.quiz[Q.i]; quizHTML=`<div class="small muted">Soru ${Q.i+1}/${c.quiz.length}</div><div style="font-weight:600;margin-top:4px">${esc(q)}</div><div class="opts">${opts.map((o,k)=>`<button class="opt ${Q.ans!=null?(k===a?'right':(k===Q.ans?'wrong':'')):''}" data-act="cardAns" data-k="${k}"><kbd>${String.fromCharCode(65+k)}</kbd>${esc(o)}</button>`).join('')}</div>${Q.ans!=null?`<div class="fb ${Q.ans===a?'ok':'no'}">${Q.ans===a?'✓ Doğru! ':'✗ '}${esc(why)}</div><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn pri" data-act="cardNext">Devam →</button></div>`:''}`; }
  }
  $('#main').innerHTML=`<div class="stack" style="max-width:820px;margin:0 auto">
  <div class="card stack"><div class="row"><button class="btn sm ghost" data-act="cardBack">← ${R.back==='metin'?'Metne dön':'Rehber'}</button><span class="small muted sp">${GROUPS[c.g]}</span></div>
    <div><h2 style="margin:0 0 4px">${esc(c.t)}</h2><div class="muted">${esc(c.s)}</div></div>
    ${c.tani.length?`<div><h3 style="margin:0">👀 Nasıl tanırım?</h3>${li(c.tani)}</div>`:''}
    ${c.cevir.length?`<div><h3 style="margin:0">${c.g==='yontem'?'🧭 Adımlar':'🔁 Nasıl çeviririm?'}</h3>${li(c.cevir)}</div>`:''}
    ${c.ex.length?`<div><h3 style="margin:0 0 6px">📌 Örnek</h3>${c.ex.map(([e,t])=>`<div class="sent"><div class="ex">${esc(e)}</div><div class="tr">${esc(t)}</div></div>`).join('')}</div>`:''}
    ${c.tuzak.length?`<div class="fb no" style="margin:0"><b>⚠️ YDS tuzakları</b>${li(c.tuzak.map(esc))}</div>`:''}
  </div>
  ${c.quiz.length?`<div class="card stack" id="cardQuizBox"><h3 style="margin:0">Mini test</h3>${quizHTML}</div>`:''}
  <div class="card stack"><h3 style="margin:0">📝 Notlarım</h3><textarea class="in" id="gNote" rows="5" placeholder="Hocanın bu konuda söyledikleri, kendi örneklerin…">${esc(n.text||'')}</textarea><div class="row"><button class="btn sm" data-act="saveGNote" data-id="${c.id}">Kaydet</button><span class="small muted" id="gNoteMsg"></span></div></div>
  <div class="row" style="justify-content:space-between">${(()=>{ const i=GRAMMAR.indexOf(c), p=GRAMMAR[i-1], x=GRAMMAR[i+1]; return (p?`<button class="btn sm ghost" data-act="openCard" data-id="${p.id}">← ${esc(p.t.split(':')[0].split('(')[0])}</button>`:'<span></span>')+(x?`<button class="btn sm ghost" data-act="openCard" data-id="${x.id}">${esc(x.t.split(':')[0].split('(')[0])} →</button>`:''); })()}</div>
  </div>`;
  const ta=$('#gNote'); ta.addEventListener('blur', ()=>saveGNoteFrom(c.id, true));
}
function saveGNoteFrom(id, quiet){ const ta=$('#gNote'); if(!ta) return; const n={...(S.gnotes[id]||{card:id})}; const v=ta.value.trim(); if((n.text||'')===v) return; n.text=v; n.updated=Date.now(); saveGNote(n); const m=$('#gNoteMsg'); if(m) m.textContent='Kaydedildi ✓'; if(!quiet) toast('Not kaydedildi ✓'); }
function saveGNote(n){ S.gnotes[n.card]=n; persist('g_'+n.card, {...n, kind:'gnote'}); }

/* ---------- Denemeler ---------- */
const SECTIONS=[['kelime','Kelime',6],['gramer','Dil bilgisi',10],['cloze','Cloze test',10],['cumle','Cümle tamamlama',10],['ceviri','Çeviri',6],['okuma','Okuma (paragraf)',20],['diyalog','Diyalog',5],['yakin','Yakın anlam',4],['ptamam','Paragraf tamamlama',4],['bozan','Anlamı bozan cümle',5]];
const SEC_CARD={gramer:'zamanlar',cloze:'zitlik',cumle:'sebep',ceviri:'ceviri-sorusu',okuma:'asil-yuklem',yakin:'ceviri-yontemi',ptamam:'zamir',bozan:'zamir',kelime:'kelime-turu'};
const examScore=e=>Math.round(e.total*1.25*100)/100;
function saveExam(e){ const i=S.exams.findIndex(x=>x.id===e.id); if(i<0) S.exams.push(e); else S.exams[i]=e; S.exams.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.created-b.created); persist(e.id,{...e,kind:'exam'}); }
function deleteExam(id){ S.exams=S.exams.filter(x=>x.id!==id); persist(id,null); }
function examCard(){
  const E=S.exams, tgt=S.stats.target||55, need=Math.ceil(tgt/1.25);
  if(!E.length) return `<div class="card"><div class="row"><h3 class="sp" style="margin:0">📊 Denemelerim</h3><button class="btn sm pri" data-act="addExam">+ Deneme ekle</button></div><p class="small muted" style="margin:8px 0 0">YDS’de yanlışlar doğruyu götürmez; her doğru 1,25 puan. <b>${tgt} puan için ${need} doğru</b> lazım. Çözdüğün denemeleri bölüm bölüm gir, en çok nerede puan kaybettiğini göstereyim.</p></div>`;
  const last=E[E.length-1], best=Math.max(...E.map(examScore));
  const pts=E.slice(-12), W=300, H=110, pad=8;
  const xy=pts.map((e,i)=>[pad+(pts.length===1?(W-2*pad)/2:i*(W-2*pad)/(pts.length-1)), H-pad-(examScore(e)/100)*(H-2*pad)]);
  const ty=H-pad-(tgt/100)*(H-2*pad);
  const agg={}; E.slice(-5).forEach(e=>{ if(!e.sec) return; SECTIONS.forEach(([k,,mx])=>{ const v=e.sec[k]; if(v==null||v==='') return; agg[k]=agg[k]||{c:0,t:0}; agg[k].c+=+v; agg[k].t+=mx; }); });
  const weak=SECTIONS.filter(([k])=>agg[k]&&agg[k].t).map(([k,l])=>({k,l,p:agg[k].c/agg[k].t})).sort((a,b)=>a.p-b.p).slice(0,3);
  return `<div class="card stack"><div class="row"><h3 class="sp" style="margin:0">📊 Denemelerim</h3><button class="btn sm pri" data-act="addExam">+ Deneme ekle</button></div>
  <div class="row" style="gap:20px"><div><div class="small muted">Son deneme</div><div class="big" style="color:${examScore(last)>=tgt?'var(--ok)':'var(--acc)'}">${examScore(last)}</div><div class="small muted">${last.total}/80 doğru</div></div><div><div class="small muted">En iyi</div><div class="big">${best}</div></div><div class="sp small muted">${examScore(last)>=tgt?`🎉 Hedefin üstündesin!`:`Hedefe <b>${Math.max(0,need-last.total)}</b> doğru kaldı`}</div></div>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-height:160px"><line x1="0" x2="${W}" y1="${ty}" y2="${ty}" stroke="var(--ok)" stroke-dasharray="4 4" stroke-width="1"/><text x="${W-2}" y="${ty-4}" text-anchor="end" font-size="9" fill="var(--ok)">hedef ${tgt}</text>${xy.length>1?`<polyline fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" points="${xy.map(p=>p.join(',')).join(' ')}"/>`:''}${xy.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--acc)"><title>${esc(pts[i].name||'')} ${examScore(pts[i])}</title></circle>`).join('')}</svg>
  ${weak.length?`<div><div class="small muted" style="margin-bottom:6px">En çok puan kaybettiğin bölümler (son 5 deneme)</div>${weak.map(w=>`<div class="row" style="margin:4px 0"><span style="width:150px" class="small">${w.l}</span><div class="prog" style="max-width:200px"><i style="width:${Math.round(w.p*100)}%;background:${w.p<.5?'var(--bad)':w.p<.7?'var(--gold)':'var(--ok)'}"></i></div><span class="small muted">%${Math.round(w.p*100)}</span>${SEC_CARD[w.k]?`<button class="btn sm ghost" data-act="openCard" data-id="${SEC_CARD[w.k]}">📘 ilgili not</button>`:''}</div>`).join('')}</div>`:''}
  <details><summary class="small">Tüm denemeler (${E.length})</summary>${E.slice().reverse().map(e=>`<div class="row small" style="padding:6px 0;border-top:1px solid var(--line)"><b>${examScore(e)}</b><span>${e.total}/80</span><span class="muted sp">${esc(e.name||'Deneme')} · ${esc(e.date||'')}</span><button class="btn sm ghost" data-act="editExam" data-id="${e.id}">✎</button><button class="btn sm ghost" data-act="delExam" data-id="${e.id}" style="color:var(--bad)">✕</button></div>`).join('')}</details></div>`;
}
function examModal(id){
  const e=S.exams.find(x=>x.id===id)||{id:newId('e'),name:'',date:today(),sec:{},total:0,created:Date.now()};
  modal(`<div class="row"><h2 class="sp" style="margin:0">${id?'Denemeyi düzenle':'Deneme ekle'}</h2><button class="btn sm ghost" data-close>✕</button></div>
  <div class="grid g2" style="gap:10px"><div><label class="f">Ad</label><input class="in" id="xName" value="${esc(e.name)}" placeholder="ör. 2024 Sonbahar YDS"></div><div><label class="f">Tarih</label><input class="in" type="date" id="xDate" value="${esc(e.date)}"></div></div>
  <div><label class="f">Bölüm bölüm doğru sayısı (bilmediklerini boş bırak)</label>
  <div class="grid" style="grid-template-columns:1fr 1fr;gap:8px">${SECTIONS.map(([k,l,mx])=>`<div class="row" style="gap:6px;flex-wrap:nowrap"><span class="small sp">${l} <span class="muted">/${mx}</span></span><input class="in" type="number" min="0" max="${mx}" data-sec="${k}" value="${e.sec&&e.sec[k]!=null?e.sec[k]:''}" style="width:68px;padding:6px 8px"></div>`).join('')}</div></div>
  <div><label class="f">…ya da sadece toplam doğru</label><input class="in" type="number" min="0" max="80" id="xTotal" value="${e.sec&&Object.keys(e.sec).length?'':(e.total||'')}" placeholder="0–80" style="width:120px"></div>
  <div class="row"><div class="sp"><span class="big" id="xScore" style="font-size:28px">0</span> <span class="muted small">puan</span></div><button class="btn" data-close>Vazgeç</button><button class="btn pri" id="xSave">Kaydet</button></div>`);
  const calc=()=>{ const sec={}; let sum=0, any=false; $('#modal').querySelectorAll('[data-sec]').forEach(i=>{ if(i.value!==''){ const mx=+i.max; const v=Math.max(0,Math.min(mx,+i.value||0)); sec[i.dataset.sec]=v; sum+=v; any=true; } }); const total=any?sum:Math.max(0,Math.min(80,+$('#xTotal').value||0)); $('#xScore').textContent=Math.round(total*1.25*100)/100; return {sec:any?sec:{}, total}; };
  $('#modal').querySelectorAll('input').forEach(i=>i.addEventListener('input',calc)); calc();
  $('#modal').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
  $('#xSave').onclick=()=>{ const r=calc(); if(!r.total){ toast('Doğru sayısını gir.'); return; } const prevBest=S.exams.length?Math.max(...S.exams.map(examScore)):0; saveExam({...e, name:$('#xName').value.trim(), date:$('#xDate').value||today(), sec:r.sec, total:r.total}); closeModal(); if(!id){ addXp(30); if(r.total*1.25>prevBest && S.exams.length>1){ confetti(); toast('🏆 Yeni deneme rekoru!'); } } render(); };
}

/* ---------- actions ---------- */
const ACT={
  startDaily:()=>{ S.pf.scope='gunluk'; savePrefs(); const p=getPool(); if(!p.length){ toast('Bugün tekrar edilecek kart yok 🎉 Tüm defterle çalışabilirsin.'); go('calis'); return; } startGame('kart', p); },
  starter:()=>addStarter(),
  settings:()=>settingsModal(),
  backup:()=>backupModal(),
  aiFill:b=>aiFill(b),
  bulkAdd:b=>bulkAdd(b),
  toggleItem:(b,e)=>{ if(e.target.closest('button')) return; S.df.open = S.df.open===b.dataset.id?null:b.dataset.id; renderDefList(); },
  editItem:b=>editModal(b.dataset.id),
  delItem:async b=>{ const it=S.items.find(x=>x.id===b.dataset.id); if(it && await ask(`<b>${esc(it.en)}</b> silinsin mi?`,'Sil')){ deleteItem(it.id); toast('Silindi'); onData(); } },
  resetItem:b=>{ const it=S.items.find(x=>x.id===b.dataset.id); if(!it) return; Object.assign(it,{box:0,due:0,seen:0,correct:0,wrong:0}); saveItem(it); toast('Sıfırlandı, yeni kart gibi sorulacak.'); renderDefList(); },
  startGame:b=>startGame(b.dataset.k),
  quitGame:()=>{ endGame(); vCalis(); },
  toMenu:()=>{ endGame(); vCalis(); },
  again:b=>{ const k=b.dataset.k; endGame(); const p=getPool(); if(!p.length){ toast('Bu seçimde çalışılacak öğe kalmadı 🎉'); vCalis(); return; } startGame(k,p); },
  flip:()=>{ if(G&&G.k==='kart'&&!G.flip){ G.flip=true; drawGame(); } },
  rate:b=>rate(b.dataset.q),
  answer:b=>answer(+b.dataset.k),
  nextQ:()=>nextQ(),
  mL:b=>mL(b.dataset.id),
  mR:b=>mR(b.dataset.id,b),
  wHint:()=>{ G.hint++; S.stats.xp=Math.max(0,S.stats.xp-2); saveStats(); hud(); drawGame(); },
  wSkip:()=>{ const it=G.q[G.i]; G.ans={ok:false,given:''}; grade(it,'again'); drawGame(); },
  nextW:()=>nextW(),
  newText:()=>{ S.metinOpen='new'; render(); },
  textsBack:()=>{ S.metinOpen=null; render(); },
  openText:b=>{ S.metinOpen=b.dataset.id; render(); window.scrollTo(0,0); },
  saveText:()=>{ const t=textFromForm(); if(!t) return; saveText(t); S.lastSource=t.source; savePrefs(); S.metinOpen=t.id; toast('Metin kaydedildi ✓'); render(); },
  analyze:b=>{ const t=textFromForm(); if(!t) return; S.lastSource=t.source; savePrefs(); analyze(b,t); },
  reanalyze:b=>{ const t=S.texts.find(x=>x.id===b.dataset.id); if(!t) return; t.my=$('#myTr').value.trim(); analyze(b,{...t}); },
  saveMy:b=>{ const t=S.texts.find(x=>x.id===b.dataset.id); if(!t) return; t.my=$('#myTr').value.trim(); saveText({...t}); toast('Çevirin kaydedildi ✓'); },
  delText:async b=>{ if(await ask('Bu metin silinsin mi? (Deftere eklediğin kelimeler kalır.)','Sil')){ deleteText(b.dataset.id); S.metinOpen=null; render(); } },
  toggleTr:()=>{ S.hideTr=!S.hideTr; render(); },
  peek:b=>{ const d=document.querySelector(`[data-peek="${b.dataset.k}"]`); if(d){ d.hidden=false; b.remove(); } },
  addA:b=>{ const t=S.texts.find(x=>x.id===b.dataset.id); const x=t&&t.analysis.items[+b.dataset.k]; if(!x||findDup(x.en)) return; saveItem(itemFromA(t,x)); addXp(2,b); toast('Eklendi ✓ '+x.en); render(); },
  addAllA:b=>{ const t=S.texts.find(x=>x.id===b.dataset.id); if(!t) return; let n=0; t.analysis.items.forEach(x=>{ if(!findDup(x.en)){ saveItem(itemFromA(t,x)); n++; } }); if(n) addXp(Math.min(n*2,40),b); toast(n?n+' öğe defterine eklendi ✓':'Hepsi zaten defterinde ✓'); render(); },
  openCard:b=>{ const v=S.view; S.r.open=b.dataset.id; S.r.quiz=null; if(v!=='rehber') S.r.back=v; if(v!=='rehber') go('rehber'); else { render(); window.scrollTo(0,0); } },
  cardBack:()=>{ const bk=S.r.back; S.r.open=null; S.r.quiz=null; S.r.back=null; if(bk&&bk!=='rehber') go(bk); else render(); },
  cardQuiz:b=>{ S.r.quiz={id:b.dataset.id,i:0,ans:null,ok:0}; render(); const q=$('#cardQuizBox'); q&&q.scrollIntoView({block:'start',behavior:'smooth'}); },
  cardAns:b=>{ const Q=S.r.quiz; if(!Q||Q.ans!=null) return; const c=cardById(Q.id); Q.ans=+b.dataset.k; const ok=Q.ans===c.quiz[Q.i][2]; if(ok) Q.ok++; render(); if(ok) addXp(8,$('.opt.right')); },
  cardNext:()=>{ const Q=S.r.quiz; if(!Q) return; const c=cardById(Q.id); Q.i++; Q.ans=null; if(Q.i>=c.quiz.length){ const n={...(S.gnotes[c.id]||{card:c.id,text:''})}; if(n.best==null||Q.ok>n.best){ n.best=Q.ok; n.updated=Date.now(); saveGNote(n); } if(Q.ok===c.quiz.length) confetti(); } render(); },
  saveGNote:b=>saveGNoteFrom(b.dataset.id,false),
  addExam:()=>examModal(null),
  editExam:b=>examModal(b.dataset.id),
  delExam:async b=>{ if(await ask('Bu deneme silinsin mi?','Sil')){ deleteExam(b.dataset.id); render(); } },
  hlTip:b=>{ const it=S.items.find(x=>x.id===b.dataset.id); if(it) toast(it.en+' — '+it.tr, 3500); }
};
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const f=ACT[b.dataset.act]; if(f){ e.preventDefault(); f(b,e); }
});
document.addEventListener('keydown', e=>{
  if(!G || S.view!=='calis' || !$('#modal').hidden) return;
  const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea'||tag==='select') return;
  if(G.over) return;
  if(G.k==='kart'){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); if(!G.flip) ACT.flip(); } else if(G.flip&&['1','2','3'].includes(e.key)) rate(['again','hard','good'][+e.key-1]); }
  if(G.k==='test'||G.k==='bosluk'){ if(G.ans===null && ['1','2','3','4'].includes(e.key)){ const k=+e.key-1; if(k<G.q[G.i].opts.length) answer(k); } else if(G.ans!==null && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); nextQ(); } }
  if(G.k==='yaz' && G.ans && e.key==='Enter'){ e.preventDefault(); nextW(); }
});

/* ---------- start ---------- */
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden' && stT && S.mode==='cloud'){ clearTimeout(stT); stT=null; persist('_stats', {...S.stats, kind:'stats'}); } });
hud(); route(); connect();
</script>
